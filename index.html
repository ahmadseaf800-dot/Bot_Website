<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MACE PvP BOT</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px;
    }

    .aizen {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .status {
      padding: 15px;
      border-radius: 12px;
      background: #17171f;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .online {
      color: #00ff88;
    }

    .offline {
      color: #ff4444;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 7px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    input, select {
      background: #1b1b24;
      color: white;
    }

    button {
      background: #292936;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #3a3a4a;
    }

    .start {
      background: #087f45;
    }

    .stop {
      background: #a51d1d;
    }

    .console {
      background: #050507;
      border: 1px solid #292936;
      border-radius: 10px;
      padding: 12px;
      margin-top: 20px;
      height: 180px;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="aizen">⚔️ موقع آيزن</div>

  <h1>⚔️ MACE PvP BOT</h1>

  <div class="status">
    Status:
    <span id="status" class="offline">OFFLINE</span>
  </div>

  <input id="host" placeholder="Server IP">

  <input id="port" type="number" placeholder="Port" value="25565">

  <input id="username" placeholder="Bot Username">

  <select id="mode">
    <option value="sword">Sword PvP</option>
    <option value="mace">Mace PvP</option>
    <option value="axe">Axe PvP</option>
    <option value="crystal">Crystal PvP</option>
  </select>

  <input id="target" placeholder="Target Username (اختياري)">

  <button class="start" onclick="startBot()">▶️ START BOT</button>

  <button class="stop" onclick="stopBot()">⛔ STOP BOT</button>

  <button onclick="checkStatus()">🔄 CHECK STATUS</button>

  <div class="console" id="console">
جاهز...
  </div>

</div>

<script>

const BACKEND_URL = "http://87.106.100.187:6818";

const statusElement = document.getElementById("status");
const consoleElement = document.getElementById("console");

function log(message) {
  consoleElement.textContent += "\n" + message;
  consoleElement.scrollTop = consoleElement.scrollHeight;
}

async function startBot() {

  const host = document.getElementById("host").value.trim();
  const port = document.getElementById("port").value;
  const username = document.getElementById("username").value.trim();
  const mode = document.getElementById("mode").value;
  const target = document.getElementById("target").value.trim();

  if (!host || !username) {
    log("❌ اكتب Server IP و Bot Username");
    return;
  }

  log("⏳ جاري تشغيل البوت...");

  try {

    const response = await fetch(`${BACKEND_URL}/start`, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        host: host,
        port: Number(port),
        username: username,
        mode: mode,
        target: target
      })
    });

    const data = await response.json();

    log("📡 " + JSON.stringify(data));

    checkStatus();

  } catch (error) {

    log("❌ فشل الاتصال بالـBackend");
    log(error.message);

  }
}

async function stopBot() {

  log("⛔ جاري إيقاف البوت...");

  try {

    const response = await fetch(`${BACKEND_URL}/stop`, {
      method: "POST"
    });

    const data = await response.json();

    log("📡 " + JSON.stringify(data));

    checkStatus();

  } catch (error) {

    log("❌ فشل الاتصال بالـBackend");
    log(error.message);

  }
}

async function checkStatus() {

  try {

    const response = await fetch(`${BACKEND_URL}/status`);

    const data = await response.json();

    if (data.status === "online") {

      statusElement.textContent = "ONLINE";
      statusElement.className = "online";

    } else {

      statusElement.textContent =
        data.status.toUpperCase();

      statusElement.className = "offline";
    }

    log(
      `Status: ${data.status} | ` +
      `${data.username || "-"} | ` +
      `${data.server || "-"}:${data.port}`
    );

  } catch (error) {

    statusElement.textContent = "ERROR";
    statusElement.className = "offline";

    log("❌ Backend غير متاح");

  }
}

checkStatus();

</script>

</body>
</html>
